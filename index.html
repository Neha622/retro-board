<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sprint Retro Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="panel title-panel">
      <h1>Sprint Retro Board</h1>
    </div>
    <div class="panel toolbar">
      <button id="copy-link-btn" type="button" class="btn"><span aria-hidden="true">🔗</span> Copy link</button>
      <button id="new-board-btn" type="button" class="btn">New board</button>
      <button id="sort-btn" type="button" class="btn">Sort by votes</button>
      <!-- Shown to the facilitator only (spec Story 8.5). -->
      <button id="clear-btn" type="button" class="btn btn-danger" hidden>Clear board</button>
    </div>
  </header>

  <div class="notices">
    <p id="connection-banner" class="notice notice-warning" role="status" aria-live="polite" hidden></p>
    <p id="app-message" class="notice" role="status" aria-live="polite" hidden></p>
    <div id="link-box" class="notice link-box" hidden>
      <label for="link-input">Copy this link:</label>
      <input id="link-input" class="link-input" type="text" readonly>
    </div>
    <p id="save-notice" class="notice" role="status" hidden></p>
  </div>

  <!-- Shown instead of the board while it opens, or when it can't be opened (spec Stories 16.7, 19.4). -->
  <section id="status-screen" class="status-screen" aria-live="polite" hidden>
    <p id="status-text" class="status-text"></p>
    <button id="status-btn" type="button" class="btn btn-primary" hidden></button>
  </section>

  <main id="board" class="board" hidden>
    <!-- On wide screens the viewport is the whiteboard: app.js and canvas.js pan and zoom the world. -->
    <div id="viewport" class="viewport">
      <div id="world" class="world">
        <section class="frame frame-retro" aria-labelledby="retro-title">
          <h2 id="retro-title" class="frame-title">Retro</h2>
          <!-- The three columns are built by app.js from the list in logic.js. -->
          <div id="retro-body" class="frame-body"></div>
        </section>

        <section class="frame frame-health" aria-labelledby="health-title">
          <h2 id="health-title" class="frame-title">Squad Health Check</h2>
          <div class="frame-body health-body">
            <table class="health-table">
              <thead>
                <tr>
                  <th scope="col" class="area-col">Area</th>
                  <th scope="col" class="example-col">Example of Awesome</th>
                  <th scope="col" class="vote-col vote-awesome"><span aria-hidden="true">🟢</span> Awesome</th>
                  <th scope="col" class="vote-col vote-fine"><span aria-hidden="true">🟡</span> Fine</th>
                  <th scope="col" class="vote-col vote-sad"><span aria-hidden="true">🔴</span> Sad</th>
                  <th scope="col" class="example-col">Example of Crappy</th>
                  <th scope="col" class="notes-col">Notes &amp; Comments</th>
                </tr>
              </thead>
              <!-- One row per area, built by app.js. -->
              <tbody id="health-rows"></tbody>
            </table>
            <!-- Shown to the facilitator only (spec Story 15.0). -->
            <button id="add-area" type="button" class="btn add-area-btn" hidden>+ Add area</button>
          </div>
        </section>
      </div>
    </div>

    <div class="panel zoom-controls" role="group" aria-label="Zoom">
      <button id="zoom-out" type="button" class="zoom-btn" aria-label="Zoom out">−</button>
      <span id="zoom-label" class="zoom-label" aria-live="polite">100%</span>
      <button id="zoom-in" type="button" class="zoom-btn" aria-label="Zoom in">+</button>
      <button id="zoom-fit" type="button" class="zoom-btn zoom-fit">Fit</button>
    </div>
  </main>

  <div id="emoji-picker" class="picker" role="dialog" aria-label="Choose an emoji" hidden></div>

  <script src="config.js"></script>
  <script src="logic.js"></script>
  <script src="storage.js"></script>
  <script src="cloud.js"></script>
  <script src="canvas.js"></script>
  <script src="app.js"></script>
</body>
</html>
